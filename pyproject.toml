[project]
name = "ai-evaluation-helper"
version = "0.1.0"
description = "Multi-agent AI assistant for exam question paper generation and answer sheet evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "tenacity>=8.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavy ML dependencies — install with: uv sync --extra ml
ml = [
    "sentence-transformers>=2.7",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "pillow>=10.3",
    "numpy>=1.26",
    "rapidocr-onnxruntime>=1.3",
    "pymupdf>=1.24",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# Streamlit frontend (FR-012); talks to the API only.
ui = [
    "streamlit>=1.35",
]

# Non-package (virtual) project: the `src/` directory is imported directly
# (e.g. `uvicorn src.main:app` from the project root).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["Development Skills", "storage", "datas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
